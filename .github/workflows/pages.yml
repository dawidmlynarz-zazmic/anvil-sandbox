# Builds the demos and publishes them to GitHub Pages:
#   https://<owner>.github.io/anvil-sandbox/            a list of demos
#   https://<owner>.github.io/anvil-sandbox/aeg-stage-studio/
#   https://<owner>.github.io/anvil-sandbox/axs-ticketing-agent/
#   https://<owner>.github.io/anvil-sandbox/travelpass-ai/
#
# Optional password screen: add a repository secret DEMO_PASSWORD and re-run this workflow. Only its SHA-256 goes into
# the build. It keeps casual visitors out; it is not access control (the site and the source are public).
name: Pages

on:
  push:
    branches: [main]
  # Picks up Anvil (Storybook) changes daily. Run it by hand to publish an Anvil change straight away.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Follows Anvil's main, so the hosted demos match Storybook. The build typechecks against it: if an Anvil change
  # breaks a demo, the build fails and the last good version stays live. Set a commit SHA here to freeze it instead.
  ANVIL_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Anvil
        uses: actions/checkout@v4
        with:
          repository: dawidmlynarz-zazmic/anvil-ui
          ref: ${{ env.ANVIL_REF }}
          path: anvil-ui

      # The demos read Anvil from a sibling folder (../anvil-ui), as in local development.
      - name: Put Anvil next to the repo
        run: |
          echo "Built against Anvil $(git -C anvil-ui rev-parse --short HEAD): $(git -C anvil-ui log -1 --format=%s)" >> "$GITHUB_STEP_SUMMARY"
          mv anvil-ui ../anvil-ui

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Anvil's dependencies
        working-directory: ../anvil-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the demos' dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Stage Studio
        env:
          BASE_PATH: /${{ github.event.repository.name }}/aeg-stage-studio/
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            export VITE_DEMO_GATE="$(printf '%s' "$DEMO_PASSWORD" | sha256sum | cut -d' ' -f1)"
          fi
          pnpm --filter aeg-stage-studio build

      - name: Build Ask AXS
        env:
          BASE_PATH: /${{ github.event.repository.name }}/axs-ticketing-agent/
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            export VITE_DEMO_GATE="$(printf '%s' "$DEMO_PASSWORD" | sha256sum | cut -d' ' -f1)"
          fi
          pnpm --filter axs-ticketing-agent build

      - name: Build TravelPass AI
        env:
          BASE_PATH: /${{ github.event.repository.name }}/travelpass-ai/
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            export VITE_DEMO_GATE="$(printf '%s' "$DEMO_PASSWORD" | sha256sum | cut -d' ' -f1)"
          fi
          pnpm --filter travelpass-ai build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r demos/aeg-stage-studio/dist _site/aeg-stage-studio
          cp -r demos/axs-ticketing-agent/dist _site/axs-ticketing-agent
          cp -r demos/travelpass-ai/dist _site/travelpass-ai
          # Pages serves 404.html for any unknown path. With more than one single-page app, it sends deep links
          # (…/aeg-stage-studio/p/<id>/stills) to that demo's index.html, which restores the path (spa-github-pages).
          cp site/404.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}aeg-stage-studio/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
