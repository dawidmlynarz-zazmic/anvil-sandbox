<!doctype html>
<html lang="en" data-brand="axs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A client preview, not a public site: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Restores a deep link that site/404.html redirected to /?/some/route (GitHub Pages single-page-app fallback).
      ;(function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash)
        }
      })(window.location)
    </script>
    <title>Ask AXS (demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    />
  </head>
  <body>
    <script>
      // Dark by default (the AXS app is dark); keep a light choice across reloads (set before paint, so there's no flash).
      try {
        if (localStorage.getItem('axs-ticketing-agent:theme') !== 'light') document.documentElement.classList.add('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
