<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A client preview, not a public site: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Restores a deep link that site/404.html redirected to /?/some/route (GitHub Pages single-page-app fallback).
      ;(function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Theme before first paint (no flash). Light by default; "system" follows the OS.
      try {
        var t = localStorage.getItem('hr-mate:theme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>HR Mate prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
