<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A client preview, not a public site: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Stage Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    />
  </head>
  <body>
    <script>
      // Light by default; keep a dark choice across reloads (set before paint, so there's no flash).
      try {
        if (localStorage.getItem('stage-studio:theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
