<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Anvil sandbox</title>
    <style>
      :root { --bg: #f7f7f8; --fg: #16181d; --muted: #5d636f; --line: #dfe1e6; --link: #3b4cc0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #eceef2; --muted: #9aa0ab; --line: #2a2e35; --link: #9aa6ff; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { margin: 0; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      li { padding: 1rem 0; border-bottom: 1px solid var(--line); }
      a { color: var(--link); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Anvil sandbox</h1>
      <p>Clickable client demos built with Anvil UI. Previews only: nothing here calls a model.</p>
      <ul>
        <li>
          <a href="aeg-stage-studio/">Stage Studio</a>
          <p>AEG · generative stage design: from a brief to stills, motion, artist review and a production handoff.</p>
        </li>
      </ul>
    </main>
  </body>
</html>
